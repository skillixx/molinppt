<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232731"/>
      <stop offset="0.62" stop-color="#5a514c"/>
      <stop offset="1" stop-color="#c7825a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#171b26" flood-opacity="0.22"/>
    </filter>
    <pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1H8" stroke="#171b26" stroke-opacity="0.025"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#ece6dd"/>
  <rect width="1280" height="720" fill="url(#paper)"/>

  <!-- 后排历程页 -->
  <g transform="translate(55 72) rotate(-3 285 170)" filter="url(#shadow)">
    <rect width="570" height="340" rx="4" fill="#fffdf9"/>
    <rect x="24" y="22" width="522" height="296" fill="none" stroke="#2a2f3f" stroke-opacity="0.32"/>
    <text x="42" y="48" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#171b26">FEATURE STORY</text>
    <text x="514" y="48" font-family="Arial" font-size="18" font-weight="800" fill="#c7825a">03</text>
    <line x1="42" y1="60" x2="528" y2="60" stroke="#171b26" stroke-width="2"/>
    <text x="42" y="108" font-family="Arial,Microsoft YaHei,sans-serif" font-size="33" font-weight="900" fill="#171b26">从起点，到长期主义</text>
    <text x="392" y="92" font-family="Arial,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#4a5160">每一次选择，</text>
    <text x="392" y="109" font-family="Arial,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#4a5160">都定义品牌。</text>
    <line x1="42" y1="190" x2="528" y2="190" stroke="#171b26" stroke-width="3"/>
    <g font-family="Arial,Microsoft YaHei,sans-serif">
      <g transform="translate(42 0)"><circle cx="0" cy="190" r="6" fill="#c7825a"/><text x="0" y="224" font-size="20" font-weight="900" fill="#c7825a">2012</text><text x="0" y="248" font-size="10" fill="#4a5160">品牌从一个真实问题出发</text></g>
      <g transform="translate(166 0)"><circle cx="0" cy="190" r="6" fill="#c7825a"/><text x="0" y="224" font-size="20" font-weight="900" fill="#c7825a">2016</text><text x="0" y="248" font-size="10" fill="#4a5160">形成第一套产品方法</text></g>
      <g transform="translate(290 0)"><circle cx="0" cy="190" r="6" fill="#c7825a"/><text x="0" y="224" font-size="20" font-weight="900" fill="#c7825a">2020</text><text x="0" y="248" font-size="10" fill="#4a5160">与用户共同扩展边界</text></g>
      <g transform="translate(414 0)"><circle cx="0" cy="190" r="6" fill="#c7825a"/><text x="0" y="224" font-size="20" font-weight="900" fill="#c7825a">2026</text><text x="0" y="248" font-size="10" fill="#4a5160">走向更长期的价值</text></g>
    </g>
  </g>

  <!-- 后排人物专访页 -->
  <g transform="translate(654 76) rotate(3 285 170)" filter="url(#shadow)">
    <rect width="570" height="340" rx="4" fill="#fffdf9"/>
    <rect x="24" y="22" width="522" height="296" fill="none" stroke="#2a2f3f" stroke-opacity="0.32"/>
    <text x="42" y="48" font-family="Arial" font-size="13" font-weight="700" fill="#171b26">FEATURE STORY</text>
    <text x="514" y="48" font-family="Arial" font-size="18" font-weight="800" fill="#c7825a">04</text>
    <line x1="42" y1="60" x2="528" y2="60" stroke="#171b26" stroke-width="2"/>
    <rect x="42" y="84" width="220" height="206" fill="url(#portrait)"/>
    <circle cx="152" cy="134" r="36" fill="#d5a786"/>
    <path d="M84 292c8-78 39-112 68-112 32 0 65 34 72 112" fill="#171b26"/>
    <text x="294" y="135" font-family="Georgia,serif" font-size="78" font-weight="700" fill="#c7825a">“</text>
    <text x="300" y="176" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="900" fill="#171b26">品牌不是一句话，</text>
    <text x="300" y="207" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="900" fill="#171b26">而是一系列选择。</text>
    <line x1="300" y1="257" x2="510" y2="257" stroke="#171b26"/>
    <text x="300" y="278" font-family="Arial,Microsoft YaHei,sans-serif" font-size="10" font-weight="700" fill="#4a5160">人物专访 · 核心观点</text>
  </g>

  <!-- 主封面 -->
  <g transform="translate(224 214)" filter="url(#shadow)">
    <rect width="832" height="468" rx="5" fill="#f6f1ea"/>
    <rect x="28" y="24" width="776" height="420" fill="none" stroke="#2a2f3f" stroke-opacity="0.4"/>
    <text x="50" y="56" font-family="Arial" font-size="14" font-weight="800" letter-spacing="2" fill="#171b26">BRAND JOURNAL</text>
    <text x="752" y="56" font-family="Arial" font-size="20" font-weight="900" fill="#c7825a">01</text>
    <line x1="50" y1="70" x2="782" y2="70" stroke="#171b26" stroke-width="3"/>
    <text x="56" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="58" font-weight="900" fill="#171b26">讲述品牌</text>
    <text x="56" y="220" font-family="Arial,Microsoft YaHei,sans-serif" font-size="58" font-weight="900" fill="#171b26">真正相信的事</text>
    <rect x="56" y="254" width="188" height="7" fill="#c7825a"/>
    <text x="56" y="291" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#4a5160">从创始初心、人物选择到长期价值，</text>
    <text x="56" y="316" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#4a5160">用真实叙事建立可被信任的品牌。</text>
    <g font-family="Arial" font-size="10" font-weight="800" fill="#171b26">
      <text x="56" y="400">01 STORY</text><text x="148" y="400">02 PEOPLE</text><text x="249" y="400">03 VALUES</text>
    </g>
    <rect x="536" y="94" width="214" height="300" fill="url(#portrait)"/>
    <circle cx="643" cy="172" r="46" fill="#d5a786"/>
    <path d="M565 394c10-104 46-150 79-150 38 0 76 46 86 150" fill="#171b26"/>
    <rect x="550" y="110" width="186" height="266" fill="none" stroke="#fff" stroke-opacity="0.62"/>
    <text x="560" y="366" font-family="Arial" font-size="9" font-weight="800" letter-spacing="1" fill="#fff">PORTRAIT / STORY</text>
  </g>
</svg>
